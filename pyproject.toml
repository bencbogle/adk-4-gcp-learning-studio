[project]
name = "adk-4-gcp-learning-studio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2,<3",
    "google-cloud-discoveryengine>=0.20.2",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]
